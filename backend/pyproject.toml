[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eprep-backend"
version = "0.0.1"
description = "Enthernet Prep AI — backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openai>=1.30",
    "mcp>=2.2",
    "cryptography>=42",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # Needed by tests/conftest.py so FastAPI's lifespan runs under
    # httpx.ASGITransport (which doesn't fire lifespan events on its own).
    # The MCP session managers' background task groups depend on it.
    "asgi-lifespan>=2.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
